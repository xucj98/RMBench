memory_schema: ../memory_schemas/drawer_sorting_x1pro.yaml

dataset:
  task: drawer_sorting
  source_dir: data/x1pro_table_clean
  repo_id: drawer_sorting_x1pro_shared_memory_sm2sm_15hz
  required_tag: drawer_sorting
  task_prompt: observe the drawers, then place each table item into the drawer containing the same item type
  source_fps: 30
  target_fps: 15

state_layout:
  state_dim: 32
  robot_dim: 28
  slave_dim: 14
  master_dim: 14
  availability_mask_dim: 31

memory_adapter:
  type: shared
  full_state:
    encoding: implicit_unknown_one_hot
    dim: [28, 31]
    unknown_value: observe
  state_token:
    query_stride: 15
    serial_conditioning: teacher_forcing

training:
  action_horizon: 30
  state_history_size: 3
  state_future_size: 3
  state_step: 1
  latency_step: 3
  soft_action_boundary: true
  forced_execution_memory_action_loss: masked
