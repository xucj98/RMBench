dataset:
  task: battery_try
  source_dir: data/battery_try/demo_clean_state
  repo_id: battery_try_demo_clean_state_token
  episodes: 50
state_layout:
  state_dim: 14
  robot_dim: 14
structured_state_tokens:
  fields:
  - name: phase
    labels:
    - place_initial_00
    - try_10
    - try_11
    - try_01
    ranges:
    - label: place_initial_00
      window:
      - episode_start
      - micro_stages.place_initial_00_battery2_return.end_frame
    - label: try_10
      window:
      - micro_stages.place_initial_00_battery2_return.end_frame
      - micro_stages.try_10_battery1_return.end_frame
      optional: true
    - label: try_11
      window:
      - micro_stages.try_10_battery1_return.end_frame
      - micro_stages.try_11_battery2_return.end_frame
      optional: true
    - label: try_01
      window:
      - micro_stages.try_11_battery2_return.end_frame
      - micro_stages.try_01_battery1_return.end_frame
      optional: true
  query_stride: 20
